<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#F7F7F3" />
    <title>Auto Router · 管理控制台</title>
    <script>
      // Anti-flash: apply the persisted theme before first paint. The manual choice wins
      // over the system preference; [data-theme] is the single switch the tokens read.
      try {
        var stored = window.localStorage.getItem('auto-router-color-mode');
        var mode = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', mode);
        document.documentElement.style.colorScheme = mode;
      } catch (e) { /* first paint still uses light defaults */ }
    </script>

    <link rel="stylesheet" crossorigin href="/admin/static/web/assets/index-D_eyQqj5.css">
  </head>

    <div id="app"></div>
  </body>
</html>
